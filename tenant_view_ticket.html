{% extends "base.html" %}
{% block content %}
<div class="container py-5">
    <div class="glass-card p-5 mx-auto" style="max-width: 700px; border-radius: 30px; background: white;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold" style="color: var(--sage-green);">Ticket Status</h2>
            <span class="badge rounded-pill px-4 py-2" style="background: var(--sage-green);">{{ ticket.status }}</span>
        </div>

        <div class="mb-4">
            <label class="mini-label">Ticket ID</label>
            <p class="fs-5 fw-bold">#{{ ticket.ticket_id }}</p>
        </div>

        <div class="p-4 rounded-4 mb-4" style="background: #fdfaf5; border: 1px dashed #e2d1c3;">
            <label class="mini-label">Your Complaint</label>
            <h5 class="fw-bold">{{ ticket.issue_type }}</h5>
            <p class="text-muted mb-0">{{ ticket.description }}</p>
        </div>

        {% if ticket.photo %}
        <div class="mb-4 text-center">
            <label class="mini-label d-block text-start mb-2">Submitted Evidence</label>
            <img src="{{ url_for('static', filename='uploads/' + ticket.photo) }}" 
                 class="rounded-4 w-100 shadow-sm" style="max-height: 300px; object-fit: cover;">
        </div>
        {% endif %}

        <a href="{{ url_for('tenant_dash') }}" class="btn btn-outline-secondary w-100 rounded-pill mt-3">
            Back to My Dashboard
        </a>
    </div>
</div>
{% endblock %}
