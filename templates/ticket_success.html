{% extends "base.html" %}
{% block content %}
<div class="container py-5 text-center">
    <div class="glass-card col-md-6 mx-auto p-5">
        <div class="mb-4">
            <i class="fa-solid fa-circle-check fa-5x text-success"></i>
        </div>
        <h2 class="fw-bold">Complaint Submitted!</h2>
        <p class="text-muted">Your Ticket ID is: <strong>{{ ticket_id }}</strong></p>
        <hr>
        <div class="d-grid gap-2">
            <a href="{{ url_for('dashboard') }}" class="btn btn-outline-dark">Go to Dashboard</a>
            <a href="{{ url_for('raise_ticket') }}" class="btn btn-dark" style="background: #6b705c;">Raise New Complaint</a>
        </div>
    </div>
</div>
{% endblock %}
