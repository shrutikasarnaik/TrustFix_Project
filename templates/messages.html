<!DOCTYPE html>
<html>
<head>
    <title>TrustFix | Support</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f5f5dc; display: flex; min-height: 100vh; margin: 0; font-family: 'Segoe UI', sans-serif; }
        
        /* Sidebar Styles */
        .sidebar { width: 260px; background: white; border-right: 1px solid #ddd; padding: 25px; position: fixed; height: 100%; z-index: 1000; }
        .nav-link { color: #4a4a4a; padding: 12px; border-radius: 10px; text-decoration: none; display: block; transition: 0.3s; margin-bottom: 5px; font-size: 0.95rem; }
        .nav-link:hover { background: #f0f0e0; color: #6b705c; }
        .nav-link.active { background: #6b705c; color: white; }
        
        /* Main Content & Chat UI */
        .main-content { flex-grow: 1; margin-left: 260px; padding: 40px; display: flex; flex-direction: column; }
        .chat-container { 
            background: rgba(255, 255, 255, 0.8); 
            backdrop-filter: blur(15px); 
            border-radius: 20px; 
            height: 80vh; 
            display: flex; 
            flex-direction: column;
            border: 1px solid white;
            box-shadow: 0 8px 32px rgba(0,0,0,0.05);
        }
        .chat-header { padding: 20px; border-bottom: 1px solid #eee; display: flex; align-items: center; }
        .chat-messages { flex-grow: 1; padding: 25px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .msg-bot { background: #e9edc9; color: #6b705c; padding: 12px 18px; border-radius: 15px 15px 15px 0; align-self: flex-start; max-width: 75%; }
        .msg-user { background: #6b705c; color: white; padding: 12px 18px; border-radius: 15px 15px 0 15px; align-self: flex-end; max-width: 75%; }
        .chat-input-area { padding: 20px; border-top: 1px solid #eee; background: white; border-radius: 0 0 20px 20px; }
        .search-box { background: #f8f9fa; border: none; border-radius: 10px; padding: 8px 15px; font-size: 0.9rem; width: 100%; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h4 style="color: #6b705c; margin-bottom: 30px; font-weight: 700;">TRUSTFIX</h4>
        
        <div class="mb-4">
            <input type="text" class="search-box" placeholder="Search tickets or chats...">
        </div>

        <a href="{{ url_for('dashboard') }}" class="nav-link"><i class="fa-solid fa-house me-2"></i> Dashboard</a>
        <a href="{{ url_for('raise_ticket') }}" class="nav-link"><i class="fa-solid fa-circle-plus me-2"></i> Raise Ticket</a>
        
        <div class="mt-4 mb-2 small fw-bold text-muted ps-2" style="letter-spacing: 1px;">COMMUNICATION</div>
        <a href="{{ url_for('messages', type='bot') }}" class="nav-link {% if mode == 'bot' %}active{% endif %}">
            <i class="fa-solid fa-robot me-2"></i> HelpBot Chat
        </a>
        <a href="{{ url_for('messages', type='owner') }}" class="nav-link {% if mode == 'owner' %}active{% endif %}">
            <i class="fa-solid fa-user-tie me-2"></i> Owner/Technician
        </a>
        
        <hr class="my-4">
        <a href="{{ url_for('logout') }}" class="nav-link text-danger"><i class="fa-solid fa-power-off me-2"></i> Logout</a>
    </div>

    <div class="main-content">
        <div class="chat-container">
            <div class="chat-header">
                <div class="rounded-circle p-3 me-3" style="background: #fefae0; color: #6b705c;">
                    <i class="fa-solid {{ icon }} fa-xl"></i>
                </div>
                <div>
                    <h5 class="m-0" style="font-weight: 600;">{{ title }}</h5>
                    <small class="text-success"><i class="fa-solid fa-circle fa-2xs"></i> Always Active</small>
                </div>
            </div>

            <div class="chat-messages" id="chatWindow">
                <div class="msg-bot">
                    Hello {{ user }}! I am your {{ title }}. How can I assist you with your property today?
                </div>
            </div>

            <div class="chat-input-area">
                <form class="input-group">
                    <input type="text" class="form-control border-0 bg-light py-2" placeholder="Write your message..." style="border-radius: 12px 0 0 12px;">
                    <button class="btn px-4" style="background: #6b705c; color: white; border-radius: 0 12px 12px 0;">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </form>
            </div>
        </div>
    </div>

</body>
</html>
