{% extends "base.html" %}
{% block content %}
<div class="container py-4">
    <div class="glass-card col-md-8 mx-auto border-0 shadow-sm" style="border-radius: 20px; background: white;">
        <h3 class="mb-4" style="color: #6b705c;"><i class="fa-solid fa-ticket me-2"></i> Raise a Service Request</h3>
        
        <form method="POST" enctype="multipart/form-data">
            <div class="row bg-light p-3 rounded mb-4 mx-1">
                <p class="small fw-bold text-muted text-uppercase mb-3">Verified Contact Info</p>
                <div class="col-md-6 mb-3">
                    <label class="small fw-bold">Name</label>
                    <input type="text" class="form-control border-0 bg-white" value="{{ user.name }}" readonly>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="small fw-bold">Contact Number</label>
                    <input type="text" class="form-control border-0 bg-white" value="{{ user.phone or 'Update Profile First' }}" readonly>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="small fw-bold">Flat / Area</label>
                    <input type="text" class="form-control border-0 bg-white" value="{{ user.area or 'N/A' }}" readonly>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="small fw-bold">Registered Email</label>
                    <input type="text" class="form-control border-0 bg-white" value="{{ user.email or 'N/A' }}" readonly>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="fw-bold small">Issue Category</label>
                    <select name="issue_type" class="form-select border-0 bg-light" required>
                        <option value="Plumbing">Plumbing</option>
                        <option value="Electrical">Electrical</option>
                        <option value="Carpentry">Carpentry</option>
                        <option value="General">General Maintenance</option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="fw-bold small">Urgency Level</label>
                    <select name="urgency" class="form-select border-0 bg-light" required>
                        <option value="Low">Low (Can wait)</option>
                        <option value="Medium">Medium (Fix soon)</option>
                        <option value="High">High (Urgent / Emergency)</option>
                    </select>
                </div>
                <div class="col-12 mb-3">
                    <label class="fw-bold small">Describe the Problem</label>
                    <textarea name="description" class="form-control border-0 bg-light" rows="3" placeholder="Explain the issue..." required></textarea>
                </div>
                <div class="col-12 mb-4">
                    <label class="fw-bold small">Upload Photo of Issue</label>
                    <input type="file" name="issue_photo" class="form-control border-0 bg-light">
                </div>
            </div>

            <button type="submit" class="btn btn-dark w-100 py-2" style="background: #6b705c; border-radius: 10px;">
                Generate & Submit Ticket
            </button>
        </form>
    </div>
</div>
{% endblock %}
